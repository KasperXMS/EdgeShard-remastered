syntax = "proto3";

package edgeshard;

// ===========================================================================
// Common types
// ===========================================================================

message DeviceInfo {
  string device_id = 1;
  string device_type = 2;  // "cuda", "jetson", "cpu"
  string name = 3;
  int32 total_memory_mb = 4;
  string compute_capability = 5;
  map<string, string> properties = 6;
  GpuMetrics gpu_metrics = 7;  // Dynamic GPU metrics (if applicable)
}

// Dynamic GPU metrics (NVML)
message GpuMetrics {
  int32 utilization_percent = 1;      // GPU compute utilization 0-100
  int32 memory_utilization_percent = 2; // Memory controller utilization 0-100
  int32 temperature_c = 3;            // Temperature in Celsius
  int32 power_draw_mw = 4;            // Current power draw in milliwatts
  int32 power_limit_mw = 5;           // Power limit in milliwatts
  int64 free_memory_mb = 6;           // Current free memory in MB
}

// Dynamic CPU metrics
message CpuMetrics {
  float utilization_percent = 1;      // CPU utilization 0-100
  int64 used_memory_mb = 2;           // Currently used system memory
}

// Per-device dynamic metrics
message DeviceMetrics {
  string device_id = 1;
  GpuMetrics gpu_metrics = 2;  // For GPU devices
  CpuMetrics cpu_metrics = 3;  // For CPU devices
}

// Network metrics between workers
message NetworkMetrics {
  map<string, int32> latency_ms_to_worker = 1;  // worker_id -> latency_ms
  int64 estimated_bandwidth_mbps = 2;           // Estimated bandwidth
}

message WorkerState {
  string worker_id = 1;
  string hostname = 2;
  repeated DeviceInfo devices = 3;
  int32 available_memory_mb = 4;
  int32 cpu_count = 5;
  string status = 6;  // "online", "offline", "busy"
  map<string, string> metadata = 7;
  int64 last_heartbeat = 8;  // Unix timestamp
  repeated DeviceMetrics device_metrics = 9;  // Dynamic device metrics
  NetworkMetrics network_metrics = 10;        // Network metrics
}

// ===========================================================================
// Worker Registration
// ===========================================================================

message RegisterWorkerRequest {
  string worker_id = 1;
  string hostname = 2;
  repeated DeviceInfo devices = 3;
  int32 available_memory_mb = 4;
  int32 cpu_count = 5;
  map<string, string> metadata = 6;
}

message RegisterWorkerResponse {
  bool success = 1;
  string message = 2;
  string master_id = 3;
}

message HeartbeatRequest {
  string worker_id = 1;
  int32 available_memory_mb = 2;
  string status = 3;
  map<string, string> metadata = 4;
  repeated DeviceMetrics device_metrics = 5;  // Dynamic device metrics
  NetworkMetrics network_metrics = 6;         // Network metrics
}

message HeartbeatResponse {
  bool success = 1;
  string message = 2;
}

message UnregisterWorkerRequest {
  string worker_id = 1;
}

message UnregisterWorkerResponse {
  bool success = 1;
  string message = 2;
}

// ===========================================================================
// Cluster Discovery
// ===========================================================================

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated WorkerState workers = 1;
}

message GetWorkerRequest {
  string worker_id = 1;
}

message GetWorkerResponse {
  WorkerState worker = 1;
}

// ===========================================================================
// Service Management
// ===========================================================================

message ServiceSpec {
  string name = 1;
  string model_name = 2;
  string model_revision = 3;
  string dtype = 4;
  int32 max_batch_size = 5;
  int32 max_sequence_length = 6;
  string scheduling_policy = 7;
}

message DeployServiceRequest {
  ServiceSpec spec = 1;
}

message DeployServiceResponse {
  bool success = 1;
  string message = 2;
  string service_name = 3;
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated string service_names = 1;
}

message GetServiceStatusRequest {
  string service_name = 1;
}

message GetServiceStatusResponse {
  string service_name = 1;
  string status = 2;  // "deploying", "ready", "failed", "stopped"
  int32 shard_count = 3;
  string message = 4;
}

message StopServiceRequest {
  string service_name = 1;
}

message StopServiceResponse {
  bool success = 1;
  string message = 2;
}

// ===========================================================================
// Profiling
// ===========================================================================

message ProfileRequest {
  string model_name = 1;
  string model_revision = 2;
  string dtype = 3;
  string device = 4;
}

message ProfileResponse {
  bool success = 1;
  string message = 2;
  float layer_forward_ms = 3;
  float kv_cache_per_token_mb = 4;
  float prefill_tokens_per_sec = 5;
  float decode_tokens_per_sec = 6;
  int32 num_layers_profiled = 7;
  float total_model_memory_mb = 8;
  string device_name = 9;
}

// ===========================================================================
// Placement (M7)
// ===========================================================================

message ShardPlacementProto {
  int32 shard_index = 1;
  string worker_id = 2;
  int32 layer_start = 3;
  int32 layer_end = 4;
  string device = 5;
}

message PlacementPlanMessage {
  string service_name = 1;
  int32 version = 2;
  string model_name = 3;
  string model_revision = 4;
  string dtype = 5;
  repeated ShardPlacementProto shards = 6;
  float estimated_latency_ms = 7;
  float estimated_throughput_tps = 8;
}

message ApplyPlacementRequest {
  PlacementPlanMessage plan = 1;
}

message ApplyPlacementResponse {
  bool success = 1;
  string message = 2;
}

// ===========================================================================
// Shard Lifecycle (M8)
// ===========================================================================

message StartShardRequest {
  string shard_id = 1;
  string model_name = 2;
  string model_revision = 3;
  string dtype = 4;
  int32 layer_start = 5;
  int32 layer_end = 6;
  string device = 7;
  string data_host = 8;       // Data plane host (for shard-to-shard communication)
  int32 data_port = 9;        // Data plane port
  bool is_first_shard = 10;   // Has embedding layer
  bool is_last_shard = 11;    // Has LM head
  string master_address = 12; // Master address for registration
}

message StartShardResponse {
  bool success = 1;
  string message = 2;
  string shard_id = 3;
  string data_address = 4;    // Actual data plane address
}

message StopShardRequest {
  string shard_id = 1;
}

message StopShardResponse {
  bool success = 1;
  string message = 2;
}

message ListShardsRequest {}

message ListShardsResponse {
  repeated ShardInfo shards = 1;
}

message ShardInfo {
  string shard_id = 1;
  string model_name = 2;
  int32 layer_start = 3;
  int32 layer_end = 4;
  string device = 5;
  string status = 6;          // "starting", "ready", "failed", "stopped"
  string data_address = 7;    // Data plane address
  int64 start_time = 8;       // Unix timestamp
  string pid = 9;             // Process ID (if local)
}

// ===========================================================================
// Shard Endpoints for Inference (M8)
// ===========================================================================

message ShardEndpoint {
  string shard_id = 1;
  string worker_id = 2;
  string data_address = 3;    // host:port for data plane
  int32 layer_start = 4;
  int32 layer_end = 5;
  string device = 6;
}

message RegisterShardsRequest {
  string service_name = 1;
  repeated ShardEndpoint shards = 2;
}

message RegisterShardsResponse {
  bool success = 1;
  string message = 2;
}

message GetShardEndpointsRequest {
  string service_name = 1;    // Optional: if empty, returns any ready deployment
}

message GetShardEndpointsResponse {
  string service_name = 1;
  repeated ShardEndpoint endpoints = 2;
}

// ===========================================================================
// Services
// ===========================================================================

service WorkerService {
  // Worker registration and lifecycle
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc UnregisterWorker(UnregisterWorkerRequest) returns (UnregisterWorkerResponse);

  // Cluster discovery
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse);

  // Service management
  rpc DeployService(DeployServiceRequest) returns (DeployServiceResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc GetServiceStatus(GetServiceStatusRequest) returns (GetServiceStatusResponse);
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);

  // Profiling
  rpc Profile(ProfileRequest) returns (ProfileResponse);

  // Placement (M7)
  rpc ApplyPlacement(ApplyPlacementRequest) returns (ApplyPlacementResponse);

  // Shard lifecycle (M8)
  rpc StartShard(StartShardRequest) returns (StartShardResponse);
  rpc StopShard(StopShardRequest) returns (StopShardResponse);
  rpc ListShards(ListShardsRequest) returns (ListShardsResponse);

  // Shard endpoints for inference (M8)
  rpc RegisterShards(RegisterShardsRequest) returns (RegisterShardsResponse);
  rpc GetShardEndpoints(GetShardEndpointsRequest) returns (GetShardEndpointsResponse);
}
