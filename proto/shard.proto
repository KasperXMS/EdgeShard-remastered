syntax = "proto3";

package edgeshard.shard;

// Shard-to-shard tensor transfer protocol.
// This is the DATA PLANE — Master is not involved.

message TensorMessage {
  // Tensor shape
  repeated int64 shape = 1;
  // Tensor dtype (e.g., "float16", "float32")
  string dtype = 2;
  // Raw tensor data
  bytes data = 3;
  // Session ID for routing
  string session_id = 4;
}

message SendTensorRequest {
  string source_shard_id = 1;
  string target_shard_id = 2;
  TensorMessage tensor = 3;
}

message SendTensorResponse {
  bool success = 1;
  string message = 2;
}

message RecvTensorRequest {
  string session_id = 1;
  string source_shard_id = 2;
}

message RecvTensorResponse {
  bool success = 1;
  string message = 2;
  TensorMessage tensor = 3;
}

// ===========================================================================
// Inference RPCs — allow remote clients to run inference on a shard
// ===========================================================================

message CreateSessionRequest {
  string session_id = 1;
  int32 batch_size = 2;
  int32 max_seq_len = 3;
}

message CreateSessionResponse {
  bool success = 1;
  string message = 2;
}

message InferenceRequest {
  string session_id = 1;
  // For first-shard prefill: input token IDs
  TensorMessage input_ids = 2;
  // For non-first-shard prefill/decode: hidden states from previous shard
  TensorMessage hidden_states = 3;
  // For first-shard decode: single token ID
  int32 token_id = 4;
}

message InferenceResponse {
  bool success = 1;
  string message = 2;
  // Output tensor: logits (last shard) or hidden states (other shards)
  TensorMessage output = 3;
}

message ReleaseSessionRequest {
  string session_id = 1;
}

message ReleaseSessionResponse {
  bool success = 1;
  string message = 2;
}

// Shard service — each shard runs this
service ShardService {
  // Tensor transfer (inter-shard data plane)
  rpc SendTensor(SendTensorRequest) returns (SendTensorResponse);
  rpc RecvTensor(RecvTensorRequest) returns (RecvTensorResponse);
  rpc Ping(RecvTensorRequest) returns (SendTensorResponse);

  // Inference (remote client → shard)
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc RunPrefill(InferenceRequest) returns (InferenceResponse);
  rpc RunDecode(InferenceRequest) returns (InferenceResponse);
  rpc ReleaseSession(ReleaseSessionRequest) returns (ReleaseSessionResponse);
}
