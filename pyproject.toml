[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgeshard"
version = "0.2.0"
description = "Config-driven distributed inference for heterogeneous edge and GPU resources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EdgeShard contributors" }]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
master = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]
worker = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "docker>=7.0",
    "psutil>=5.9",
    "pynvml>=11.5",
]
runtime = [
    "torch>=2.2",
    "transformers>=4.40",
    "safetensors>=0.4",
    "accelerate>=0.29",
]
observability = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = [
    "edgeshard[master,worker,runtime,observability,dev]",
]

[project.scripts]
edgeshard = "edgeshard.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeshard"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
